<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ausreden-Generator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Erfindet absurde Ausreden fürs Zuspätkommen – mit Beweisfoto.">
<style>
  :root {
    --bg: #f6f1e7;
    --surface: #fffdf8;
    --text: #2a2522;
    --muted: #6d625a;
    --accent: #e4572e;
    --accent-text: #ffffff;
    --chip: #ece4d6;
    --chip-on: #2a2522;
    --chip-on-text: #fffdf8;
    --border: #d8cdbb;
    --shadow: 0 10px 30px rgba(60, 40, 20, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1917;
      --surface: #26231f;
      --text: #f1ebe2;
      --muted: #b3a89b;
      --accent: #ff7a50;
      --accent-text: #1b1917;
      --chip: #34302b;
      --chip-on: #f1ebe2;
      --chip-on-text: #1b1917;
      --border: #423c35;
      --shadow: 0 10px 30px rgba(0, 0, 0, .4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1917; --surface: #26231f; --text: #f1ebe2; --muted: #b3a89b;
    --accent: #ff7a50; --accent-text: #1b1917; --chip: #34302b; --chip-on: #f1ebe2;
    --chip-on-text: #1b1917; --border: #423c35; --shadow: 0 10px 30px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.8rem, 7vw, 2.6rem);
    line-height: 1.1;
    letter-spacing: -.02em;
    text-align: center;
  }
  .untertitel { margin: -8px 0 0; color: var(--muted); text-align: center; }
  fieldset { border: 0; margin: 0; padding: 0; width: 100%; }
  legend { font-weight: 600; margin: 0 auto 8px; text-align: center; }
  #anlass-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--chip);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 14px;
    font: inherit;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-text); border-color: var(--chip-on); }
  #anlass-frei {
    display: block;
    width: 100%;
    max-width: 340px;
    margin: 12px auto 0;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    text-align: center;
  }
  button { font: inherit; }
  #generieren {
    border: 0;
    border-radius: 16px;
    padding: 16px 28px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 1.25rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .1s ease;
  }
  #generieren:active { transform: scale(.97); }
  #ausrede-text {
    min-height: 3em;
    margin: 0;
    font-size: 1.15rem;
    font-weight: 500;
    text-align: center;
    overflow-wrap: anywhere;
  }
  #ausrede-text:empty { display: none; }
  #beweis {
    display: block;
    width: 100%;
    max-width: 480px;
    height: auto;
    aspect-ratio: 800 / 960;
    border-radius: 14px;
    box-shadow: var(--shadow);
  }
  #beweis[hidden] { display: none; }
  #beweis.neu { animation: reinfliegen .6s cubic-bezier(.2, .9, .3, 1.2); }
  @keyframes reinfliegen {
    from { opacity: 0; transform: translateY(30px) rotate(-8deg) scale(.9); }
    to { opacity: 1; transform: none; }
  }
  #aktionen { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  #aktionen[hidden] { display: none; }
  #aktionen button {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 12px;
    padding: 10px 16px;
    cursor: pointer;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  #speichern {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 14px;
    border: 1px dashed var(--border);
    border-radius: 14px;
    background: var(--surface);
  }
  #speichern[hidden] { display: none; }
  #speichern-hinweis { margin: 0; text-align: center; color: var(--muted); }
  #speichern-bild { width: 100%; max-width: 100%; height: auto; border-radius: 10px; }
  #speichern-schliessen {
    border: 1px solid var(--border); background: var(--chip); color: var(--text);
    border-radius: 12px; padding: 8px 16px; cursor: pointer;
  }
  #meldung { margin: 0; color: var(--muted); text-align: center; min-height: 1.5em; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    #beweis.neu { animation: none; }
    #generieren { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Ausreden-Generator</h1>
  <p class="untertitel">Zu spät? Wir liefern die Ausrede – und den Beweis.</p>

  <fieldset>
    <legend>Wofür bist du zu spät?</legend>
    <div id="anlass-chips"></div>
    <input id="anlass-frei" type="text" maxlength="40" placeholder="…oder eigener Anlass" aria-label="Eigener Anlass">
  </fieldset>

  <button id="generieren" type="button">Ausrede generieren!</button>

  <p id="ausrede-text" aria-hidden="true"></p>
  <p id="ausrede-sr" class="sr-only" aria-live="polite"></p>
  <canvas id="beweis" width="800" height="960" hidden aria-label="Beweisfoto"></canvas>

  <div id="aktionen" hidden>
    <button id="noch-eine" type="button">🔄 Noch eine</button>
    <button id="modus" type="button">🎨 Als Kunstwerk</button>
    <button id="download" type="button">⬇️ Beweis herunterladen</button>
  </div>
  <p id="meldung" role="status"></p>
  <div id="speichern" hidden>
    <p id="speichern-hinweis">Kein Download gestartet? Bild lange drücken (Handy) oder Rechtsklick → „Bild speichern“.</p>
    <img id="speichern-bild" alt="Beweisbild zum Speichern">
    <button id="speichern-schliessen" type="button">Schließen</button>
  </div>
</main>
<script src="ausreden.js"></script>
<script src="polaroid.js"></script>
<script src="kunst.js"></script>
<script src="app.js"></script>
</body>
</html>
